<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MusicOne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    p { color: #888888; font-size: 14px; max-width: 280px; line-height: 1.4; }
    button {
      margin-top: 24px;
      padding: 10px 20px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>MusicOne</h1>
  <p id="msg">Connecting to live service...</p>
  <button id="retryBtn" style="display: none;" onclick="window.location.href='https://themusic.one'">Retry</button>
  <script>
    setTimeout(function() {
      var msg = document.getElementById('msg');
      var btn = document.getElementById('retryBtn');
      if (msg && btn) {
        msg.innerText = 'Unable to reach themusic.one. Please check your internet connection.';
        btn.style.display = 'inline-block';
      }
    }, 10000);
  </script>
</body>
</html>
