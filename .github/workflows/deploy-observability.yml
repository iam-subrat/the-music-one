name: Deploy Observability Stack

on:
  push:
    branches: [main,staging]
    paths:
      - "observability/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-observability.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy → Loki + Promtail + Grafana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy observability stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GRAFANA_PASSWORD,GF_SERVER_ROOT_URL
          script: |
            cd /opt/musicone
            git pull
            docker compose -f docker-compose.yml up -d loki promtail grafana
            docker image prune -f
        env:
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          GF_SERVER_ROOT_URL: ${{ vars.GRAFANA_ROOT_URL }}
      - name: Health check
        run: |
          sleep 10
          curl -f https://grafana.themusic.one/api/health || exit 1
