name: Deploy Staging API

on:
  push:
    branches: [staging]
    paths:
      - "api/**"
      - "docker-compose*.yml"
      - ".github/workflows/deploy-api-staging.yml"
  workflow_dispatch:

jobs:
  migrate:
    name: Migrate → Staging DB
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy → Staging
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Build & deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_URL,SUPABASE_URL,SUPABASE_ANON_KEY,YOUTUBE_API_KEY,ODESLI_API_KEY,ALLOWED_ORIGINS,FRONTEND_URL,ROOT_PATH,COOKIE_DOMAIN,COOKIE_SAMESITE,SPOTIFY_CLIENT_ID,SPOTIFY_CLIENT_SECRET
          script: |
            cd /opt/musicone
            git pull
            COMPOSE_PROJECT_NAME=musicone-staging \
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build api
            docker image prune -f
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ODESLI_API_KEY: ${{ secrets.ODESLI_API_KEY }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          ROOT_PATH: ${{ vars.ROOT_PATH }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          COOKIE_SAMESITE: ${{ vars.COOKIE_SAMESITE }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      - name: Health check
        run: |
          sleep 15
          curl -f https://api-staging.themusic.one/api/health || exit 1
