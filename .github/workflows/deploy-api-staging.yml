name: Deploy Staging API

on:
  push:
    branches: [staging]
    paths:
      - "api/**"
      - "docker-compose*.yml"
      - ".github/workflows/deploy-api-staging.yml"
  workflow_dispatch:

jobs:
  migrate:
    name: Migrate → Staging DB
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy → Staging
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Build & deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_URL,SUPABASE_URL,SUPABASE_ANON_KEY,YOUTUBE_API_KEY,ODESLI_API_KEY,ALLOWED_ORIGINS,FRONTEND_URL,ROOT_PATH,COOKIE_DOMAIN,COOKIE_SAMESITE,SPOTIFY_CLIENT_ID,SPOTIFY_CLIENT_SECRET
          script: |
            cd /opt/musicone
            git pull
            export COMPOSE_PROJECT_NAME=musicone-staging
            export DATABASE_URL="$DATABASE_URL"
            export SUPABASE_URL="$SUPABASE_URL"
            export SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
            export YOUTUBE_API_KEY="$YOUTUBE_API_KEY"
            export ODESLI_API_KEY="$ODESLI_API_KEY"
            export SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID"
            export SPOTIFY_CLIENT_SECRET="$SPOTIFY_CLIENT_SECRET"
            export ALLOWED_ORIGINS="$ALLOWED_ORIGINS"
            export FRONTEND_URL="$FRONTEND_URL"
            export ROOT_PATH="$ROOT_PATH"
            export COOKIE_DOMAIN="$COOKIE_DOMAIN"
            export COOKIE_SAMESITE="$COOKIE_SAMESITE"
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build api
            docker image prune -f
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ODESLI_API_KEY: ${{ secrets.ODESLI_API_KEY }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          ROOT_PATH: ${{ vars.ROOT_PATH }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          COOKIE_SAMESITE: ${{ vars.COOKIE_SAMESITE }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      - name: Health check (poll)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://api.themusic.one/musicone-staging/api/health; then
              echo "Staging API healthy after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after 60s."
          exit 1
