name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    # Tests mock external services, but importing the FastAPI app requires these settings.
    # Keep placeholders here rather than exposing deployment secrets to pull requests.
    env:
      DATABASE_URL: postgresql://localhost:5432/musicone_test
      SUPABASE_URL: https://example.test
      SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen

      - name: Run Pytest
        working-directory: api
        run: uv run pytest

  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Run Vitest
        working-directory: ui
        run: npm run test
