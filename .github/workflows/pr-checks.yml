name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: musicone_test_shared_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Tests mock external services, but importing the FastAPI app requires these settings.
    # Keep placeholders here rather than exposing deployment secrets to pull requests.
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/musicone_test_shared_queue
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/musicone_test_shared_queue
      SUPABASE_URL: https://example.test
      SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen

      - name: Run Pytest
        working-directory: api
        run: uv run pytest

  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Run Vitest
        working-directory: ui
        run: npm run test

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build web
        working-directory: ui
        run: npm run build

      - name: Build mobile
        working-directory: mobile
        run: npm run build

      - name: Install Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        working-directory: ui
        run: npx playwright test
